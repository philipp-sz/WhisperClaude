[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperclaude"
version = "0.1.0"
description = "Local push-a-hotkey dictation for Windows (Wispr Flow clone)."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "numpy",
    "sounddevice",
    "pynput",
    "pyperclip",
    "pystray",
    "pillow",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["whisperclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # slow tests are opt-in: pytest -m slow
markers = ["slow: loads a real Whisper model (run with -m slow)"]
