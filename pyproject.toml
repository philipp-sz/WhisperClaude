[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperclaude"
version = "0.1.0"
description = "Local push-a-hotkey dictation for Windows (Wispr Flow clone)."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "openvino-genai>=2026.4",  # Intel iGPU backend (falls back to CPU without it)
    "py3langid>=0.3",  # source language of text to translate
    "numpy",
    "sounddevice",
    "pynput",
    "pystray",
    "pillow",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]
# NVIDIA GPU: the CUDA 12 libraries CTranslate2 needs (~1.3 GB), for Whisper and translation
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[tool.setuptools]
packages = ["whisperclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # slow tests are opt-in: pytest -m slow
markers = ["slow: loads a real Whisper or translation model (run with -m slow)"]
