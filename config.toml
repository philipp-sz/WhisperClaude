# WhisperClaude settings. Every key is optional (missing = default shown here).
# Changes apply after a restart: tray icon -> "Restart (apply config)".

[hotkey]
key = "ctrl_l"        # tap alone to start/stop: "ctrl_l", "ctrl_r", "f9", "pause", ...
max_hold_s = 0.5      # holding the key longer than this doesn't count as a tap
cancel_key = "esc"    # pressed while recording: throw the recording away ("" = off)

[model]
device = "auto"       # "auto" = Intel iGPU via OpenVINO if available, else CPU | "gpu" | "cpu"
gpu_model = "large-v3-turbo"  # on the iGPU: ~0.3 s per 10 s audio, ~half the energy of the CPU path
cpu_model = "small"   # CPU fallback (faster-whisper): "small" (fast) / "large-v3-turbo" (~5x slower)
# The following four only apply to the CPU path:
compute_type = "int8"
cpu_threads = 4       # 8 was slower for small (P/E-core mix), see docs/decisions.md
beam_size = 1         # 5 = slightly different results, ~10 % slower
batch_size = 4
language = ""         # "" = auto-detect (German/English), or lock it: "de" / "en"
# Correctly punctuated example text; Whisper copies its style (punctuation, casing)
# and it keeps mixed German/English audio from being translated into one language.
initial_prompt = "Hallo, das ist ein Test. Okay, so let's see how this works, and then we'll decide."
# Words Whisper should spell exactly as written (names, products, technical terms).
# Fixed in tests: "Klot" -> "Claude", "Gmini" -> "Gemini"; "cloud" + "Claude" together work.
# Keep the list short (it shares ~220 tokens with the prompt).
vocabulary = ["Claude", "cloud", "Gemini", "VS Code", "iGPU"]

[recording]
# A recording with no speech for this long was probably forgotten: it stops by itself, and the
# text is put in the clipboard (not pasted: you may be typing somewhere else by then). 0 = never.
stop_after_silence_s = 60

[history]
# The last dictations are saved locally (%LOCALAPPDATA%\WhisperClaude\history.json, only your
# Windows user can read it; never uploaded). Tray icon -> "Recent dictations" copies one back,
# e.g. when it was pasted while no text field had focus. 0 = off (also deletes the file).
keep = 5

[tray]
# Look of the tray icon: "bars" (sound bars follow your voice), "pulse" (glows with your voice,
# spinner while transcribing), "ring" (dark icon, colored status ring), or "classic" (the
# original static icon). Animations only run while recording/transcribing.
style = "bars"

[paste]
restore_delay_s = 0.3 # wait before restoring your old clipboard (raise if an app pastes the old text)

[commands]
# Spoken formatting: say the trigger word followed by a command and it is replaced by the
# formatting, in any language you dictate in:
#   "command new line" -> line break      "command new paragraph" -> blank line
#   "command bullet"   -> new line + "- " "command separator" -> "---" (Markdown separator)
#   "command open quote" ... "command close quote" -> "..."
# Nothing else is ever touched. A bullet item ends at the end of its sentence (or at the next
# command); the text after it continues after a blank line.
enabled = false       # off by default: set to true to use the commands, then tray -> Restart
trigger = "command"   # a plain word that doesn't occur before "new line", "bullet", ... in normal speech
bullet = "- "         # Markdown list item; "* " or "• " also work
