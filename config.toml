# WhisperClaude settings. Every key is optional (missing = default shown here).
# Changes apply after a restart: tray icon -> "Restart (apply config)".

[hotkey]
key = "ctrl_l"        # tap alone to start/stop: "ctrl_l", "ctrl_r", "f9", "pause", ...
max_hold_s = 0.5      # holding the key longer than this doesn't count as a tap
cancel_key = "esc"    # pressed while recording: throw the recording away ("" = off)

[model]
device = "auto"       # "auto" = NVIDIA GPU (CUDA) if available, else Intel iGPU (OpenVINO), else CPU
                      # | "cuda" | "igpu" | "cpu"  (NVIDIA needs: pip install -e .[cuda])
gpu_model = "auto"    # "auto": NVIDIA GPU with 4 GB free: "large-v3" (11-19 % fewer errors,
                      # 0.66 s per 10 s on an RTX 4070; int8 below 7 GB), else "large-v3-turbo";
                      # iGPU: "large-v3-turbo" (~0.3 s per 10 s, ~half the energy of the CPU)
cpu_model = "small"   # CPU fallback (faster-whisper): "small" (fast) / "large-v3-turbo" (~5x slower)
# compute_type, cpu_threads and batch_size only apply to the CPU path. On an NVIDIA GPU the
# precision follows the free memory: float16 with 7 GB, else int8 (see docs/transcription.md).
compute_type = "int8"
cpu_threads = 4       # 8 was slower for small (P/E-core mix), see docs/transcription.md
beam_size = 0         # 0 = auto: 5 on an NVIDIA GPU (fewer errors, +5 % time), 1 on the CPU
                      # (5 there: ~10 % slower, no gain). The iGPU always decodes greedily.
batch_size = 4
language = ""         # "" = auto-detect (any of Whisper's ~100 languages), or lock it: "de", "fr", ...
# Correctly punctuated example text; Whisper copies its style (punctuation, casing).
# Write it in the language(s) you dictate in: one short sentence per language. With
# several languages it also keeps mixed audio from being translated into one of them.
# This default is for German + English.
initial_prompt = "Hallo, das ist ein Test. Okay, so let's see how this works, and then we'll decide."
# Words Whisper should spell exactly as written (names, products, technical terms).
# Fixed in tests: "Klot" -> "Claude", "Gmini" -> "Gemini"; "cloud" + "Claude" together work.
# Keep the list short (it shares ~220 tokens with the prompt).
vocabulary = ["Claude", "cloud", "Gemini", "VS Code", "iGPU"]

[recording]
# A recording with no speech for this long was probably forgotten: it stops by itself, and the
# text is kept in "Recent dictations", not pasted (you may be typing somewhere else by then).
# Esc while recording keeps it the same way. 0 = never.
stop_after_silence_s = 60

[history]
# The last dictations are saved locally (%LOCALAPPDATA%\WhisperClaude\history.json, only your
# Windows user can read it; never uploaded). Tray icon -> "Recent dictations" copies one back,
# e.g. when it was pasted while no text field had focus. 0 = off (also deletes the file).
keep = 5

[tray]
# Look of the tray icon: "bars" (sound bars follow your voice), "pulse" (glows with your voice,
# spinner while transcribing), "ring" (dark icon, colored status ring), or "classic" (the
# original static icon). Animations only run while recording/transcribing.
style = "bars"

[pill]
# Animation of the status pill while recording, transcribing and translating: "wave" (layered
# color waves), "gradient" (level bars in a color gradient) or "classic" (plain bars).
style = "wave"

[translation]
# Tap the key alone: translates selected text (it is replaced by the translation), or, while
# dictating, stops the recording and pastes the dictation translated. A list opens to pick
# the language: type to search, Enter (or the key again) translates, Esc cancels. Tab picks
# the text's own language instead of "Auto" (detection), which helps with very short texts.
# Tapping Left Alt alone then no longer opens the menu bar / key tips of the focused app.
enabled = true
key = "alt_l"         # "alt_l", "alt_r", "f8", ... (must differ from [hotkey] key)
model = "auto"        # NLLB-200: "nllb-600m" (0.6 GB, faster) or "nllb-1.3b" (1.4 GB, better);
                      # "auto" = nllb-1.3b, but nllb-600m with less than 12 GB of RAM (CPU) or
                      # less than 2 GB of free VRAM (NVIDIA GPU)
device = "auto"       # "auto" = NVIDIA GPU if available, else CPU | "cuda" | "cpu"
cpu_threads = 4
# The translation model needs 1.4-5 GB of memory (nllb-1.3b on the CPU) but the key is used
# rarely. After this many minutes without a translation the model is unloaded (about 0.3 s,
# frees the memory); the next tap of the key loads it again (3-4 s, while you pick the
# language). On the CPU it is not loaded at startup either. 0 = keep it loaded all the time.
unload_after_min = 10
# The languages you write in, most used first (ISO codes: "de", "en", "es", "fr", "pl", ...).
# They help to recognize the language of short texts ("Danke", "Bis morgen"). Include English
# if you write it too. [] = take them from Windows (display language, keyboard layouts, English).
my_languages = []

[paste]
restore_delay_s = 0.3 # wait before restoring your old clipboard (raise if an app pastes the old text)

[commands]
# Spoken formatting: say the trigger word followed by a command and it is replaced by the
# formatting, in any language you dictate in:
#   "command new line" -> line break      "command new paragraph" -> blank line
#   "command bullet"   -> new line + "- " "command separator" -> "---" (Markdown separator)
#   "command open quote" ... "command close quote" -> "..."
# Nothing else is ever touched. A bullet item ends at the end of its sentence (or at the next
# command); the text after it continues after a blank line.
enabled = false       # off by default: set to true to use the commands, then tray -> Restart
trigger = "command"   # a plain word that doesn't occur before "new line", "bullet", ... in normal speech
bullet = "- "         # Markdown list item; "* " or "• " also work
